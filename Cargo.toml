[package]
name = "boring-cdc"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/hachej/boring-cdc"
description = "A bounded Postgres CDC experiment"
publish = false

[[bin]]
name = "boring-cdc"
path = "src/main.rs"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
