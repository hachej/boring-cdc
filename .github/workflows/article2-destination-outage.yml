name: Article 2 destination outage
on:
  pull_request:
    paths:
      - .github/workflows/article2-destination-outage.yml
      - scripts/e2e/article2_destination_*.py
      - scripts/e2e/article2_destination_outage.sh
      - scripts/validate/article2_destination_outage.py
      - src/m2_capture_runtime.rs
      - src/m2_journal.rs
      - src/m3_bootstrap.rs
      - src/m5_clickhouse_loop.rs
      - contracts/m2/failure-policy-cases.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  destination_outage:
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TMPDIR: /var/tmp
      BCDC_ARTICLE2_PACKET_DIR: /var/tmp/article2-destination-outage-packet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install repository-pinned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --component clippy,rustfmt --target x86_64-unknown-linux-gnu --no-self-update
      - name: Run destination outage
        run: scripts/e2e/article2_destination_outage.sh
      - name: Preserve measured packet, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: article2-destination-outage-${{ github.event.pull_request.head.sha || github.sha }}-${{ matrix.repeat }}
          path: /var/tmp/article2-destination-outage-packet
          if-no-files-found: warn
