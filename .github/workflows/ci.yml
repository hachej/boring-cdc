name: quality
on:
  pull_request:
  push:
    branches: [master, "epic/**"]
permissions:
  contents: read
jobs:
  m2_sqlite_contention:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install repository-pinned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --component clippy,rustfmt --target x86_64-unknown-linux-gnu --no-self-update
      - name: M2 SQLite contention and persisted retry proof
        timeout-minutes: 15
        env:
          TMPDIR: /var/tmp
        run: |
          cargo test --locked m2_capture_runtime::tests::persisted_retry_schedule_gates_successor_startup
          packet="$PWD/artifacts/boring-cdc-m2-capture-runtime/SCN-M2-CAPTURE-PERSISTED-RETRY/current-head"
          for attempt in 1 2; do
            if ! M2_SQLITE_CONTENTION_PROOF=1 M2_SQLITE_CONTENTION_OUT="$packet/attempt-$attempt" \
              scripts/e2e/m2_capture_runtime.sh \
              >>"$RUNNER_TEMP/m2-sqlite-contention.stdout" \
              2>>"$RUNNER_TEMP/m2-sqlite-contention.stderr"; then
              grep -E 'M2_SQLITE_CONTENTION_PHASE=' "$RUNNER_TEMP/m2-sqlite-contention.stdout" | tail -n 8 || true
              grep -Eo 'E_[A-Z0-9_]+|M2_[A-Z0-9_]+' "$RUNNER_TEMP/m2-sqlite-contention.stderr" | tail -n 12 || true
              grep -E 'AssertionError|Traceback' "$RUNNER_TEMP/m2-sqlite-contention.stderr" | tail -n 4 || true
              exit 1
            fi
          done
          python3 scripts/lib/m2_sqlite_contention_evidence.py "$packet" \
            "$RUNNER_TEMP/m2-sqlite-contention.stdout" "$RUNNER_TEMP/m2-sqlite-contention.stderr"
          python3 scripts/validate/m2_sqlite_contention.py "$packet"
          scripts/validate/evidence.sh "$packet/evidence.json"
      - name: Retain M2 SQLite contention packet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m2-sqlite-contention
          path: artifacts/boring-cdc-m2-capture-runtime/SCN-M2-CAPTURE-PERSISTED-RETRY/current-head
          if-no-files-found: error
  m2_source_commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install repository-pinned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --component clippy,rustfmt --target x86_64-unknown-linux-gnu --no-self-update
      - name: M2 source-commit crash and successor proof
        timeout-minutes: 17
        env:
          TMPDIR: /var/tmp
        run: |
          for hook in before_source_commit after_source_commit_before_feedback; do
            case "$hook" in
              before_source_commit) scenario=SCN-M2-CAPTURE-CRASH-BEFORE-COMMIT ;;
              after_source_commit_before_feedback) scenario=SCN-M2-CAPTURE-CRASH-AFTER-COMMIT ;;
            esac
            packet="$PWD/artifacts/boring-cdc-m2-capture-runtime/$scenario/current-head"
            for attempt in 1 2; do
              M2_SOURCE_COMMIT_PROOF=1 M2_SOURCE_COMMIT_HOOK="$hook" \
                M2_SOURCE_COMMIT_OUT="$packet/attempt-$attempt" \
                BORING_CDC_M2_FAULT_HOOK="$hook" \
                scripts/e2e/m2_capture_runtime.sh \
                >>"$RUNNER_TEMP/m2-source-commit-$hook.stdout" \
                2>>"$RUNNER_TEMP/m2-source-commit-$hook.stderr"
            done
            python3 scripts/lib/m2_source_commit_evidence.py "$packet" \
              "$RUNNER_TEMP/m2-source-commit-$hook.stdout" \
              "$RUNNER_TEMP/m2-source-commit-$hook.stderr" "$hook"
            python3 scripts/validate/m2_source_commit.py "$packet" "$hook"
            scripts/validate/evidence.sh "$packet/evidence.json"
          done
      - name: Retain M2 source-commit crash packets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m2-source-commit-crashes
          path: |
            artifacts/boring-cdc-m2-capture-runtime/SCN-M2-CAPTURE-CRASH-BEFORE-COMMIT/current-head
            artifacts/boring-cdc-m2-capture-runtime/SCN-M2-CAPTURE-CRASH-AFTER-COMMIT/current-head
          if-no-files-found: error
  m2_copyboth_loss:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install repository-pinned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --component clippy,rustfmt --target x86_64-unknown-linux-gnu --no-self-update
      - name: M2 CopyBoth-loss live proof
        timeout-minutes: 12
        env:
          TMPDIR: /var/tmp
        run: |
          packet="$PWD/artifacts/boring-cdc-m2-capture-runtime/SCN-M2-CAPTURE-COPYBOTH-LOSS/current-head"
          for attempt in 1 2; do
            M2_COPYBOTH_LOSS_PROOF=1 M2_COPYBOTH_LOSS_OUT="$packet/attempt-$attempt" \
              scripts/e2e/m2_capture_runtime.sh \
              >>"$RUNNER_TEMP/m2-copyboth-loss.stdout" \
              2>>"$RUNNER_TEMP/m2-copyboth-loss.stderr"
          done
          python3 scripts/lib/m2_copyboth_loss_evidence.py "$packet" \
            "$RUNNER_TEMP/m2-copyboth-loss.stdout" "$RUNNER_TEMP/m2-copyboth-loss.stderr"
          python3 scripts/validate/m2_copyboth_loss.py "$packet"
          scripts/validate/evidence.sh "$packet/evidence.json"
      - name: Retain M2 CopyBoth-loss packet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m2-copyboth-loss
          path: artifacts/boring-cdc-m2-capture-runtime/SCN-M2-CAPTURE-COPYBOTH-LOSS/current-head
          if-no-files-found: error
  m2_advisory_loss:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install repository-pinned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --component clippy,rustfmt --target x86_64-unknown-linux-gnu --no-self-update
      - name: M2 advisory-loss live proof
        timeout-minutes: 12
        env:
          TMPDIR: /var/tmp
        run: |
          packet="$PWD/artifacts/boring-cdc-m2-capture-runtime/SCN-M2-CAPTURE-ABRUPT-TAKEOVER/current-head"
          for attempt in 1 2; do
            M2_ADVISORY_LOSS_PROOF=1 M2_ADVISORY_LOSS_OUT="$packet/attempt-$attempt" \
              scripts/e2e/m2_capture_runtime.sh \
              >>"$RUNNER_TEMP/m2-advisory-loss.stdout" \
              2>>"$RUNNER_TEMP/m2-advisory-loss.stderr"
          done
          python3 scripts/lib/m2_advisory_loss_evidence.py "$packet" \
            "$RUNNER_TEMP/m2-advisory-loss.stdout" "$RUNNER_TEMP/m2-advisory-loss.stderr"
          python3 scripts/validate/m2_advisory_loss.py "$packet"
          scripts/validate/evidence.sh "$packet/evidence.json"
      - name: Retain M2 advisory-loss packet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m2-advisory-loss
          path: artifacts/boring-cdc-m2-capture-runtime/SCN-M2-CAPTURE-ABRUPT-TAKEOVER/current-head
          if-no-files-found: error
  m2_wire_limit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install repository-pinned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --component clippy,rustfmt --target x86_64-unknown-linux-gnu --no-self-update
      - name: M2 wire-limit safe-stop live proof
        timeout-minutes: 12
        env:
          TMPDIR: /var/tmp
        run: |
          packet="$PWD/artifacts/boring-cdc-m2-capture-runtime/SCN-M2-CAPTURE-OVERSIZED/current-head"
          for attempt in 1 2; do
            M2_WIRE_LIMIT_PROOF=1 M2_WIRE_LIMIT_OUT="$packet/attempt-$attempt" \
              scripts/e2e/m2_capture_runtime.sh \
              >>"$RUNNER_TEMP/m2-wire-limit.stdout" \
              2>>"$RUNNER_TEMP/m2-wire-limit.stderr"
          done
          python3 scripts/lib/m2_wire_limit_evidence.py "$packet" \
            "$RUNNER_TEMP/m2-wire-limit.stdout" "$RUNNER_TEMP/m2-wire-limit.stderr"
          python3 scripts/validate/m2_wire_limit.py "$packet"
          scripts/validate/evidence.sh "$packet/evidence.json"
      - name: Retain M2 wire-limit safe-stop packet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m2-wire-limit-safe-stop
          path: artifacts/boring-cdc-m2-capture-runtime/SCN-M2-CAPTURE-OVERSIZED/current-head
          if-no-files-found: error
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install repository-pinned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --component clippy,rustfmt --target x86_64-unknown-linux-gnu --no-self-update
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-targets
      - name: Python contract tests
        run: python3 -m unittest discover -s tests
      - name: Package boundary
        run: scripts/validate/scaffold_package.sh
      - name: Scaffold contract
        run: scripts/validate/m0_scaffold.sh
      - name: License metadata
        run: scripts/validate/scaffold_license.sh
      - name: Secret patterns
        run: scripts/validate/scaffold_secrets.sh
      - name: Dependency audit
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --deny warnings
      # Guards the documented operator path. A green unit suite is not evidence the
      # connector can start: the capture runtime once refused every publication but
      # the demo fixture's, and init failed closed against a role model nothing
      # provisioned, while the M2 suite stayed green because its harness faked the
      # slot-creation floor. This drives the real path end to end and proves
      # exactly-once against PostgreSQL's own transaction ids after a kill -9.
      - name: Durable simple case
        timeout-minutes: 20
        env:
          TMPDIR: /var/tmp
        run: scripts/acceptance/durable_simple_case.sh
      - name: Prepare exact M2 init evidence input
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: git worktree add --detach "$RUNNER_TEMP/m2-init-head" "$HEAD_SHA"
      - name: M2 init and runtime source lock
        timeout-minutes: 20
        working-directory: ${{ runner.temp }}/m2-init-head
        env:
          TMPDIR: /var/tmp
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          mkdir -p "$RUNNER_TEMP/m2-init-receipt"
          for attempt in 1 2; do
            mkdir -p "$RUNNER_TEMP/m2-init-receipt/attempt-$attempt"
            M2_INIT_RECEIPT_DIR="$RUNNER_TEMP/m2-init-receipt/attempt-$attempt" scripts/e2e/m2_init_recovery.sh \
              >"$RUNNER_TEMP/m2-init-receipt/attempt-$attempt/stdout.txt" \
              2>"$RUNNER_TEMP/m2-init-receipt/attempt-$attempt/stderr.txt"
            python3 scripts/validate/m2_init_receipt.py "$RUNNER_TEMP/m2-init-receipt/attempt-$attempt/receipt.json"
          done
          scripts/faults/m2_init_recovery.sh \
            >"$RUNNER_TEMP/m2-init-receipt/fault-stdout.txt" \
            2>"$RUNNER_TEMP/m2-init-receipt/fault-stderr.txt"
          python3 scripts/validate/m2_init_receipt.py \
            "$RUNNER_TEMP/m2-init-receipt/attempt-1/receipt.json" \
            "$RUNNER_TEMP/m2-init-receipt/attempt-2/receipt.json"
          python3 scripts/lib/m2_init_component.py "$RUNNER_TEMP/m2-init-receipt"
          scripts/validate/evidence.sh artifacts/boring-cdc-m2-init-recovery
      - name: Retain M2 init live receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m2-init-receipt
          path: ${{ runner.temp }}/m2-init-receipt/attempt-*/receipt.json
          if-no-files-found: error
      - name: Retain M2 init component packet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m2-init-component-packet
          path: ${{ runner.temp }}/m2-init-head/artifacts/boring-cdc-m2-init-recovery
          if-no-files-found: error
      - name: Prepare exact M2 JSONL evidence input
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: git worktree add --detach "$RUNNER_TEMP/m2-jsonl-head" "$HEAD_SHA"
      - name: M2 JSONL component and fault proof
        timeout-minutes: 15
        working-directory: ${{ runner.temp }}/m2-jsonl-head
        env:
          TMPDIR: /var/tmp
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          scripts/e2e/m2_jsonl.sh
          scripts/faults/m2_jsonl.sh
          python3 scripts/validate/m2_jsonl.py all
          scripts/validate/evidence.sh artifacts/boring-cdc-m2-jsonl
      - name: Retain M2 JSONL component packets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m2-jsonl-component-packets
          path: ${{ runner.temp }}/m2-jsonl-head/artifacts/boring-cdc-m2-jsonl
          if-no-files-found: error
      - name: Prepare exact M2 reconcile evidence input
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: git worktree add --detach "$RUNNER_TEMP/m2-reconcile-head" "$HEAD_SHA"
      - name: M2 reconcile live component and fault proof
        timeout-minutes: 15
        working-directory: ${{ runner.temp }}/m2-reconcile-head
        env:
          TMPDIR: /var/tmp
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          packet="$PWD/artifacts/boring-cdc-m2-reconcile/SCN-M2-RECONCILE-LIVE-PG17/current-head"
          mkdir -p "$packet/attempt-1" "$packet/attempt-2"
          M2_RECONCILE_PROOF_OUT="$packet/attempt-1/crash-proof.json" \
            scripts/e2e/m2_reconcile.sh \
            >"$packet/attempt-1/stdout.txt" \
            2>"$packet/attempt-1/stderr.txt"
          M2_RECONCILE_PROOF_OUT="$packet/attempt-2/crash-proof.json" \
            scripts/faults/m2_reconcile.sh \
            >"$packet/attempt-2/stdout.txt" \
            2>"$packet/attempt-2/stderr.txt"
          python3 scripts/validate/m2_reconcile_component.py create "$packet"
          python3 scripts/validate/m2_reconcile_component.py validate "$packet"
          scripts/validate/evidence.sh "$packet/evidence.json"
      - name: Retain M2 reconcile component packet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m2-reconcile-component-packet
          path: ${{ runner.temp }}/m2-reconcile-head/artifacts/boring-cdc-m2-reconcile/SCN-M2-RECONCILE-LIVE-PG17/current-head
          if-no-files-found: error
      - name: Prepare exact M2 spool evidence input
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: git worktree add --detach "$RUNNER_TEMP/m2-spool-head" "$HEAD_SHA"
      - name: M2 spool component and fault proof
        timeout-minutes: 15
        working-directory: ${{ runner.temp }}/m2-spool-head
        env:
          TMPDIR: /var/tmp
        run: |
          scripts/e2e/m2_spool.sh
          scripts/faults/m2_spool.sh
          python3 scripts/validate/m2_spool.py all
          scripts/validate/evidence.sh artifacts/boring-cdc-m2-spool
      - name: Retain M2 spool component packets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m2-spool-component-packets
          path: ${{ runner.temp }}/m2-spool-head/artifacts/boring-cdc-m2-spool
          if-no-files-found: error
      - name: Prepare exact M2 capture runtime evidence input
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: git worktree add --detach "$RUNNER_TEMP/m2-capture-head" "$HEAD_SHA"
      - name: M2 capture runtime live source and fault proof
        timeout-minutes: 12
        working-directory: ${{ runner.temp }}/m2-capture-head
        env:
          TMPDIR: /var/tmp
        run: |
          scripts/e2e/m2_capture_runtime.sh
          scripts/faults/m2_capture_runtime.sh
          python3 scripts/validate/m2_capture_runtime.py
          scripts/validate/evidence.sh artifacts/boring-cdc-m2-capture-runtime
      - name: Retain M2 capture runtime packets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m2-capture-runtime-packets
          path: ${{ runner.temp }}/m2-capture-head/artifacts/boring-cdc-m2-capture-runtime
          if-no-files-found: error
      - name: M2 feedback abort receipt proof
        timeout-minutes: 8
        working-directory: ${{ runner.temp }}/m2-capture-head
        env:
          TMPDIR: /var/tmp
        run: |
          packet="$PWD/artifacts/boring-cdc-m2-feedback-receipts/SCN-M2-FEEDBACK-ABORT-RECEIPTS/current-head"
          M2_FEEDBACK_RECEIPT_OUT="$packet" scripts/faults/m2_feedback_receipts.sh
          python3 scripts/validate/m2_feedback_receipts.py packet "$packet"
          scripts/validate/evidence.sh "$packet/evidence.json"
      - name: Retain M2 feedback abort receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m2-feedback-abort-receipts
          path: ${{ runner.temp }}/m2-capture-head/artifacts/boring-cdc-m2-feedback-receipts/SCN-M2-FEEDBACK-ABORT-RECEIPTS/current-head
          if-no-files-found: error
      - name: Prepare exact M2 heartbeat evidence input
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: git worktree add --detach "$RUNNER_TEMP/m2-heartbeat-head" "$HEAD_SHA"
      - name: M2 heartbeat component and fault proof
        timeout-minutes: 12
        working-directory: ${{ runner.temp }}/m2-heartbeat-head
        env:
          TMPDIR: /var/tmp
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          scripts/e2e/m2_heartbeat.sh
          scripts/faults/m2_heartbeat.sh
          scripts/validate/evidence.sh artifacts/boring-cdc-m2-heartbeat
      - name: Retain M2 heartbeat packets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m2-heartbeat-component-packets
          path: ${{ runner.temp }}/m2-heartbeat-head/artifacts/boring-cdc-m2-heartbeat
          if-no-files-found: error
      - name: Live schema-change boundary
        timeout-minutes: 5
        env:
          TMPDIR: /var/tmp
        run: scripts/acceptance/schema_change_live.sh
