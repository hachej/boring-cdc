name: M3 receive boundary
on:
  pull_request:
    paths:
      - .github/workflows/m3-receive.yml
      - src/m3_planner.rs
      - vendor/pg_walstream/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TMPDIR: /var/tmp
      BORING_CDC_M3_EVIDENCE_SEED: receive-${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install repository-pinned Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --component clippy,rustfmt --target x86_64-unknown-linux-gnu --no-self-update
      - name: Vendored bounded receive regressions
        run: cargo test --manifest-path vendor/pg_walstream/Cargo.toml bounded_query
      - name: PostgreSQL 17.6 planner component
        run: scripts/e2e/m3_planner.sh
      - name: Planner fault boundaries
        run: scripts/faults/m3_planner.sh
      - name: Preserve validated M3 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m3-receive-${{ github.sha }}
          path: artifacts/boring-cdc-m3-planner/**/receive-${{ github.sha }}/**
          if-no-files-found: warn
