name: boring-cdc
services:
  postgres:
    # linux/amd64 child sha256:b86568d3e0fe1dfaeff52714f9da36f206a30e4c49131b82bf96982d78627409
    image: docker.io/library/postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
    platform: linux/amd64
    environment:
      POSTGRES_DB: boring_cdc
      POSTGRES_USER: boring_cdc
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_slot_wal_keep_size=65536MB", "-c", "tcp_keepalives_idle=30", "-c", "tcp_keepalives_interval=10", "-c", "tcp_keepalives_count=3", "-c", "client_connection_check_interval=10s"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boring_cdc -d boring_cdc"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    volumes: ["pgdata:/var/lib/postgresql/data"]

  clickhouse:
    # linux/amd64 child sha256:78b6f0863688458b229b597f6a1bbf891855a01cf59c3f3dbe66428571c518c9
    image: docker.io/clickhouse/clickhouse-server:25.8.2.29@sha256:74c213b4d4cb4854c2497694df0c2d153c041003eadbb0457ae62c28cb8d723f
    platform: linux/amd64
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    volumes: ["chdata:/var/lib/clickhouse"]

  connector:
    image: ${BORING_CDC_CONNECTOR_IMAGE:-boring-cdc-connector:local}
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "boring-cdc", "scaffold-check"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    volumes: ["cdcdata:/var/lib/boring-cdc"]

secrets:
  postgres_password:
    file: ${BORING_CDC_POSTGRES_PASSWORD_FILE:-.secrets/postgres_password}
volumes:
  pgdata: {}
  chdata: {}
  cdcdata: {}
