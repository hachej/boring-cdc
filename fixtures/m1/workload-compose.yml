name: boring-cdc-m1-workload
x-compose-policy-source: "owner-card:765bd3b2-4b68-4102-a9ec-43ca93357390"
services:
  postgres:
    image: docker.io/library/postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
    platform: linux/amd64
    environment: { POSTGRES_PASSWORD: workload_fixture_only, POSTGRES_DB: workload }
    command: ["postgres", "-c", "wal_level=logical"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workload && psql -U postgres -d workload -Atqc 'SELECT 1' | grep -qx 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.8.2.29@sha256:74c213b4d4cb4854c2497694df0c2d153c041003eadbb0457ae62c28cb8d723f
    platform: linux/amd64
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
